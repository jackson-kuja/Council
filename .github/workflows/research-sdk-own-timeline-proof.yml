name: Research shipped SDK own timeline proof

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-sdk-own-timeline-proof.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Parse owned RunnerJobRequest into a local-only route context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def extract_json(text: str):
              marker = text.find('Job message:')
              if marker < 0:
                  return None
              start = text.find('{', marker)
              if start < 0:
                  return None
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              return None

          candidates = sorted(
              Path('/home/runner').rglob('Worker_*.log'),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          job = None
          source = None
          for candidate in candidates:
              try:
                  text = candidate.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              raw = extract_json(text)
              if not raw:
                  continue
              try:
                  parsed = json.loads(raw)
              except Exception:
                  continue
              if parsed.get('messageType') == 'RunnerJobRequest':
                  job = parsed
                  source = candidate
                  break
          if job is None:
              raise SystemExit('RunnerJobRequest unavailable')

          endpoint = next(
              (item for item in job.get('resources', {}).get('endpoints', [])
               if item.get('name') == 'SystemVssConnection'),
              None,
          )
          if endpoint is None:
              raise SystemExit('SystemVssConnection unavailable')

          route = {
              'endpoint': endpoint['url'],
              'scope': job['plan']['scopeIdentifier'],
              'hub': job['plan']['planType'],
              'plan': job['plan']['planId'],
              'timeline': job['timeline']['id'],
              'source_file': str(source),
          }
          Path('route-context.json').write_text(json.dumps(route), encoding='utf-8')
          print('route_context_valid=true')
          print(f"hub={route['hub']}")
          print(f"plan_timeline_same={str(route['plan'].lower() == route['timeline'].lower()).lower()}")
          PY

      - name: Build and run a minimal client against the shipped runner SDK
        id: sdk
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          RUNNER_BIN="$(dirname "$(find /home/runner/actions-runner -type f -name 'GitHub.Runner.Worker.dll' -print -quit)")"
          test -n "$RUNNER_BIN"
          printf '%s' "$RUNNER_BIN" > runner-bin-path.txt

          required=(GitHub.Services.Common.dll GitHub.Services.WebApi.dll GitHub.DistributedTask.WebApi.dll)
          for name in "${required[@]}"; do
            test -f "$RUNNER_BIN/$name"
          done
          printf 'runner_sdk_assemblies_present=true\n'

          mkdir -p sdkprobe
          {
            cat <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
          EOF
            for dll in \
              "$RUNNER_BIN/GitHub.Services.Common.dll" \
              "$RUNNER_BIN/GitHub.Services.WebApi.dll" \
              "$RUNNER_BIN/GitHub.DistributedTask.WebApi.dll" \
              "$RUNNER_BIN/GitHub.Services.OAuth.dll" \
              "$RUNNER_BIN/Newtonsoft.Json.dll"; do
              if [[ -f "$dll" ]]; then
                name="$(basename "$dll" .dll)"
                printf '      <Reference Include="%s"><HintPath>%s</HintPath><Private>true</Private></Reference>\n' "$name" "$dll"
              fi
            done
            cat <<'EOF'
            </ItemGroup>
          </Project>
          EOF
          } > sdkprobe/SdkProbe.csproj

          cat > sdkprobe/Program.cs <<'CS'
          using System.Text.Json;
          using GitHub.DistributedTask.WebApi;
          using GitHub.Services.Common;

          static string Clean(string? value)
          {
              if (string.IsNullOrEmpty(value)) return string.Empty;
              var clean = System.Text.RegularExpressions.Regex.Replace(
                  value,
                  @"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "<guid>"
              );
              clean = System.Text.RegularExpressions.Regex.Replace(clean, @"[A-Za-z0-9_-]{80,}", "<opaque>");
              return clean.Length > 500 ? clean[..500] : clean;
          }

          using var document = JsonDocument.Parse(await File.ReadAllTextAsync("route-context.json"));
          var root = document.RootElement;
          var endpoint = root.GetProperty("endpoint").GetString() ?? throw new InvalidOperationException("endpoint missing");
          var scope = root.GetProperty("scope").GetString() ?? throw new InvalidOperationException("scope missing");
          var hub = root.GetProperty("hub").GetString() ?? throw new InvalidOperationException("hub missing");
          var plan = root.GetProperty("plan").GetString() ?? throw new InvalidOperationException("plan missing");
          var timelineId = root.GetProperty("timeline").GetString() ?? throw new InvalidOperationException("timeline missing");
          var token = Environment.GetEnvironmentVariable("ACTIONS_RUNTIME_TOKEN")
              ?? throw new InvalidOperationException("runtime token unavailable");

          object result;
          try
          {
              var credentials = new VssCredentials(
                  new VssOAuthAccessTokenCredential(token),
                  CredentialPromptType.DoNotPrompt
              );
              using var client = new TaskHttpClient(new Uri(endpoint), credentials);
              var timeline = await client.GetTimelineAsync(
                  Guid.Parse(scope),
                  hub,
                  Guid.Parse(plan),
                  Guid.Parse(timelineId),
                  changeId: null,
                  includeRecords: true
              );
              var records = timeline?.Records?.ToArray() ?? Array.Empty<TimelineRecord>();
              result = new
              {
                  success = true,
                  timeline_id_match = timeline?.Id == Guid.Parse(timelineId),
                  record_count = records.Length,
                  log_reference_count = records.Count(record => record.Log?.Id != null),
                  record_types = records.Select(record => record.RecordType).Where(value => value != null).Distinct().OrderBy(value => value).ToArray(),
                  record_names = records.Select(record => record.Name).Where(value => value != null).Take(30).ToArray(),
                  log_ids = records.Select(record => record.Log?.Id).Where(value => value != null).Take(30).ToArray(),
              };
          }
          catch (Exception error)
          {
              result = new
              {
                  success = false,
                  exception_type = error.GetType().FullName,
                  message = Clean(error.Message),
                  inner_type = error.InnerException?.GetType().FullName,
                  inner_message = Clean(error.InnerException?.Message),
              };
          }

          await File.WriteAllTextAsync(
              "sdk-result.json",
              JsonSerializer.Serialize(result, new JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine
          );
          CS

          set +e
          dotnet build sdkprobe/SdkProbe.csproj --configuration Release --nologo > sdk-build.log 2>&1
          build_exit=$?
          set -e
          printf 'build_exit=%s\n' "$build_exit" > sdk-build-status.txt
          if [[ "$build_exit" -eq 0 ]]; then
            OUT=sdkprobe/bin/Release/net8.0
            cp -n "$RUNNER_BIN"/*.dll "$OUT"/ || true
            set +e
            dotnet "$OUT/SdkProbe.dll" > sdk-run.log 2>&1
            run_exit=$?
            set -e
            printf 'run_exit=%s\n' "$run_exit" >> sdk-build-status.txt
          else
            printf 'run_exit=-1\n' >> sdk-build-status.txt
          fi

          if [[ ! -f sdk-result.json ]]; then
            python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          build = Path('sdk-build.log').read_text(errors='replace') if Path('sdk-build.log').exists() else ''
          run = Path('sdk-run.log').read_text(errors='replace') if Path('sdk-run.log').exists() else ''
          text = (build + '\n' + run)
          text = re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}', '<guid>', text)
          text = re.sub(r'[A-Za-z0-9_-]{80,}', '<opaque>', text)
          Path('sdk-result.json').write_text(json.dumps({
              'success': False,
              'harness_error': True,
              'diagnostic_tail': text[-2000:],
          }, indent=2) + '\n')
          PY
          fi
          cat sdk-build-status.txt
          cat sdk-result.json

      - name: Persist sanitized SDK result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const crypto = require('crypto')
            let sdk = {success: false, result_file_missing: true}
            try { sdk = JSON.parse(fs.readFileSync('sdk-result.json', 'utf8')) } catch (_) {}
            let routeContext = {}
            try { routeContext = JSON.parse(fs.readFileSync('route-context.json', 'utf8')) } catch (_) {}
            let buildStatus = ''
            try { buildStatus = fs.readFileSync('sdk-build-status.txt', 'utf8').trim() } catch (_) {}
            const hash = value => crypto.createHash('sha256').update(String(value ?? '')).digest('hex')
            const endpoint = (() => { try { return new URL(routeContext.endpoint) } catch (_) { return null } })()
            const payload = {
              workflow_run_id: context.runId,
              endpoint_origin: endpoint?.origin || '',
              endpoint_path_segment_lengths: endpoint ? endpoint.pathname.split('/').filter(Boolean).map(item => item.length) : [],
              endpoint_sha256: hash(routeContext.endpoint),
              scope_sha256: hash(routeContext.scope),
              plan_sha256: hash(routeContext.plan),
              timeline_sha256: hash(routeContext.timeline),
              plan_timeline_same: String(routeContext.plan || '').toLowerCase() === String(routeContext.timeline || '').toLowerCase(),
              hub: routeContext.hub || '',
              build_status: buildStatus,
              sdk
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'sdk-own-timeline-proof.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist fixed runner SDK result from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })

      - name: Require an exact owned positive control
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('sdk-result.json').read_text())
          if not (result.get('success') and result.get('timeline_id_match') and result.get('record_count', 0) > 0):
              raise SystemExit('OWNED_RUNNER_SDK_POSITIVE_CONTROL_FAILED')
          print('OWNED_RUNNER_SDK_POSITIVE_CONTROL_VALID')
          PY
