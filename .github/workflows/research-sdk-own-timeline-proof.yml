name: Research shipped SDK own timeline proof

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-sdk-own-timeline-proof.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Parse owned RunnerJobRequest into a local-only route context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def extract_json(text: str):
              marker = text.find('Job message:')
              if marker < 0:
                  return None
              start = text.find('{', marker)
              if start < 0:
                  return None
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              return None

          candidates = sorted(
              Path('/home/runner').rglob('Worker_*.log'),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          job = None
          source = None
          for candidate in candidates:
              try:
                  text = candidate.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              raw = extract_json(text)
              if not raw:
                  continue
              try:
                  parsed = json.loads(raw)
              except Exception:
                  continue
              if parsed.get('messageType') == 'RunnerJobRequest':
                  job = parsed
                  source = candidate
                  break
          if job is None:
              raise SystemExit('RunnerJobRequest unavailable')

          endpoint = next(
              (item for item in job.get('resources', {}).get('endpoints', [])
               if item.get('name') == 'SystemVssConnection'),
              None,
          )
          if endpoint is None:
              raise SystemExit('SystemVssConnection unavailable')

          context = {
              'endpoint': endpoint['url'],
              'scope': job['plan']['scopeIdentifier'],
              'hub': job['plan']['planType'],
              'plan': job['plan']['planId'],
              'timeline': job['timeline']['id'],
              'source_file': str(source),
          }
          Path('route-context.json').write_text(json.dumps(context), encoding='utf-8')
          print('route_context_valid=true')
          print(f"hub={context['hub']}")
          print(f"plan_timeline_same={str(context['plan'].lower() == context['timeline'].lower()).lower()}")
          PY

      - name: Build a minimal client against the runner's shipped SDK assemblies
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_BIN="$(dirname "$(find /home/runner/actions-runner -type f -name 'GitHub.Runner.Worker.dll' -print -quit)")"
          test -n "$RUNNER_BIN"
          for name in GitHub.Services.Common.dll GitHub.Services.WebApi.dll GitHub.DistributedTask.WebApi.dll; do
            test -f "$RUNNER_BIN/$name"
          done
          printf 'runner_bin_sha256=%s\n' "$(printf '%s' "$RUNNER_BIN" | sha256sum | cut -d' ' -f1)"
          printf 'runner_sdk_assemblies_present=true\n'

          mkdir -p sdkprobe
          cat > sdkprobe/SdkProbe.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="GitHub.Services.Common"><HintPath>$RUNNER_BIN/GitHub.Services.Common.dll</HintPath></Reference>
              <Reference Include="GitHub.Services.WebApi"><HintPath>$RUNNER_BIN/GitHub.Services.WebApi.dll</HintPath></Reference>
              <Reference Include="GitHub.DistributedTask.WebApi"><HintPath>$RUNNER_BIN/GitHub.DistributedTask.WebApi.dll</HintPath></Reference>
            </ItemGroup>
          </Project>
          EOF

          cat > sdkprobe/Program.cs <<'CS'
          using System.Text.Json;
          using GitHub.DistributedTask.WebApi;
          using GitHub.Services.Common;
          using GitHub.Services.WebApi;

          record RouteContext(string endpoint, string scope, string hub, string plan, string timeline, string source_file);

          static string Clean(string? value)
          {
              if (string.IsNullOrEmpty(value)) return string.Empty;
              return System.Text.RegularExpressions.Regex.Replace(
                  value,
                  @"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "<guid>"
              ).Length > 500 ? System.Text.RegularExpressions.Regex.Replace(
                  value,
                  @"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "<guid>"
              )[..500] : System.Text.RegularExpressions.Regex.Replace(
                  value,
                  @"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "<guid>"
              );
          }

          var context = JsonSerializer.Deserialize<RouteContext>(await File.ReadAllTextAsync("route-context.json"))
              ?? throw new InvalidOperationException("route context invalid");
          var token = Environment.GetEnvironmentVariable("ACTIONS_RUNTIME_TOKEN")
              ?? throw new InvalidOperationException("runtime token unavailable");

          object result;
          try
          {
              var credentials = new VssCredentials(
                  new VssOAuthAccessTokenCredential(token),
                  CredentialPromptType.DoNotPrompt
              );
              var connection = new VssConnection(new Uri(context.endpoint), credentials);
              var client = connection.GetClient<TaskHttpClient>();
              var timeline = await client.GetTimelineAsync(
                  Guid.Parse(context.scope),
                  context.hub,
                  Guid.Parse(context.plan),
                  Guid.Parse(context.timeline),
                  changeId: null,
                  includeRecords: true
              );
              var records = timeline?.Records?.ToArray() ?? Array.Empty<TimelineRecord>();
              result = new
              {
                  success = true,
                  timeline_id_match = timeline?.Id == Guid.Parse(context.timeline),
                  record_count = records.Length,
                  log_reference_count = records.Count(record => record.Log?.Id != null),
                  record_types = records.Select(record => record.RecordType).Where(value => value != null).Distinct().OrderBy(value => value).ToArray(),
                  record_names = records.Select(record => record.Name).Where(value => value != null).Take(30).ToArray(),
                  log_ids = records.Select(record => record.Log?.Id).Where(value => value != null).Take(30).ToArray(),
              };
          }
          catch (Exception error)
          {
              result = new
              {
                  success = false,
                  exception_type = error.GetType().FullName,
                  message = Clean(error.Message),
                  inner_type = error.InnerException?.GetType().FullName,
                  inner_message = Clean(error.InnerException?.Message),
              };
          }

          await File.WriteAllTextAsync(
              "sdk-result.json",
              JsonSerializer.Serialize(result, new JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine
          );
          CS

          dotnet build sdkprobe/SdkProbe.csproj --configuration Release --nologo
          OUT=sdkprobe/bin/Release/net8.0
          cp -n "$RUNNER_BIN"/*.dll "$OUT"/ || true
          dotnet "$OUT/SdkProbe.dll"
          cat sdk-result.json

      - name: Persist sanitized SDK result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const crypto = require('crypto')
            let sdk = {success: false, result_file_missing: true}
            try { sdk = JSON.parse(fs.readFileSync('sdk-result.json', 'utf8')) } catch (_) {}
            let context = {}
            try { context = JSON.parse(fs.readFileSync('route-context.json', 'utf8')) } catch (_) {}
            const hash = value => crypto.createHash('sha256').update(String(value ?? '')).digest('hex')
            const endpoint = (() => { try { return new URL(context.endpoint) } catch (_) { return null } })()
            const payload = {
              workflow_run_id: context.runId,
              endpoint_origin: endpoint?.origin || '',
              endpoint_path_segment_lengths: endpoint ? endpoint.pathname.split('/').filter(Boolean).map(item => item.length) : [],
              endpoint_sha256: hash(context.endpoint),
              scope_sha256: hash(context.scope),
              plan_sha256: hash(context.plan),
              timeline_sha256: hash(context.timeline),
              plan_timeline_same: String(context.plan || '').toLowerCase() === String(context.timeline || '').toLowerCase(),
              hub: context.hub || '',
              sdk
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'sdk-own-timeline-proof.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist runner SDK timeline result from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })

      - name: Require an exact owned positive control
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('sdk-result.json').read_text())
          if not (result.get('success') and result.get('timeline_id_match') and result.get('record_count', 0) > 0):
              raise SystemExit('OWNED_RUNNER_SDK_POSITIVE_CONTROL_FAILED')
          print('OWNED_RUNNER_SDK_POSITIVE_CONTROL_VALID')
          PY
