name: GHBB public pull_request_target run payload sampler

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sample public pull_request_target workflow-run objects
        id: sample
        uses: actions/github-script@v7
        env:
          SAMPLE_REPOSITORIES: github/docs,github/codeql,ossf/scorecard,kubernetes/kubernetes,rust-lang/rust,microsoft/vscode
        with:
          script: |
            const fs = require('fs')
            const repositories = (process.env.SAMPLE_REPOSITORIES || '')
              .split(',').map(v => v.trim()).filter(Boolean)
            const matches = []
            const inspected = []

            for (const full of repositories) {
              const [owner, repo] = full.split('/')
              if (!owner || !repo) continue
              let repoId = null
              try {
                const metadata = await github.rest.repos.get({owner, repo})
                repoId = metadata.data.id
              } catch (_) {
                inspected.push({repository: full, error: 'repo_metadata_unavailable'})
                continue
              }

              let seen = 0
              for (let page = 1; page <= 5 && matches.length < 20; page += 1) {
                let response
                try {
                  response = await github.rest.actions.listWorkflowRunsForRepo({
                    owner,
                    repo,
                    event: 'pull_request_target',
                    per_page: 100,
                    page
                  })
                } catch (_) {
                  inspected.push({repository: full, error: 'workflow_runs_unavailable'})
                  break
                }
                const runs = response.data.workflow_runs || []
                seen += runs.length
                for (const run of runs) {
                  const prs = Array.isArray(run.pull_requests) ? run.pull_requests : []
                  for (const pr of prs) {
                    const prHeadRepo = pr?.head?.repo
                    if (!prHeadRepo?.id || prHeadRepo.id === repoId) continue
                    const headRepository = run.head_repository || null
                    matches.push({
                      sampled_repository: full,
                      sampled_repository_id: repoId,
                      run_id: run.id,
                      event: run.event,
                      status: run.status,
                      conclusion: run.conclusion,
                      head_sha: run.head_sha,
                      head_commit_id: run.head_commit?.id || null,
                      head_repository_id: headRepository?.id || null,
                      head_repository_full_name: headRepository?.full_name || null,
                      pr_number: pr.number,
                      pr_head_sha: pr?.head?.sha || null,
                      pr_head_repository_id: prHeadRepo.id,
                      pr_head_repository_name: prHeadRepo.name || null,
                      pr_base_repository_id: pr?.base?.repo?.id || null,
                      head_repository_is_base: headRepository?.id === repoId,
                      head_repository_is_pr_fork: headRepository?.id === prHeadRepo.id,
                      head_sha_is_pr_head: run.head_sha === pr?.head?.sha,
                      head_commit_is_pr_head: run.head_commit?.id === pr?.head?.sha
                    })
                    if (matches.length >= 20) break
                  }
                  if (matches.length >= 20) break
                }
                if (runs.length < 100) break
              }
              inspected.push({repository: full, repository_id: repoId, runs_seen: seen})
              if (matches.length >= 20) break
            }

            const result = {inspected, matches}
            fs.writeFileSync('public-prtarget-run-samples.json', JSON.stringify(result, null, 2) + '\n')
            const decisive = matches.find(item => item.head_repository_is_base)
            core.setOutput('decisive', decisive ? 'true' : 'false')
            core.setOutput('matches', String(matches.length))

            const lines = [
              '<!-- ghbb-public-prtarget-run-sampler -->',
              `GHBB public pull_request_target run sampling for run ${context.runId}:`,
              `- repositories_inspected: \`${inspected.length}\``,
              `- fork_pr_runs_found: \`${matches.length}\``,
              `- head_repository_is_base_found: \`${Boolean(decisive)}\``
            ]
            if (decisive) {
              for (const [key, value] of Object.entries(decisive)) {
                lines.push(`- decisive_${key}: \`${value}\``)
              }
            }
            lines.push('- only public workflow-run metadata was queried')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            })

      - name: Upload sanitized public run samples
        uses: actions/upload-artifact@v7
        with:
          name: ghbb-public-prtarget-run-samples-${{ github.run_id }}
          path: public-prtarget-run-samples.json
          retention-days: 1
          if-no-files-found: error
