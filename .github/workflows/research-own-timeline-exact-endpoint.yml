name: Research exact SystemVssConnection timeline proof

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-own-timeline-exact-endpoint.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Parse the owned RunnerJobRequest and read its live timeline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''

            const files = []
            function walk(root, depth = 0) {
              if (depth > 7) return
              let entries = []
              try { entries = fs.readdirSync(root, {withFileTypes: true}) } catch (_) { return }
              for (const entry of entries) {
                const full = path.join(root, entry.name)
                if (entry.isDirectory()) {
                  if (/(_diag|runner|work|temp)/i.test(full) || depth < 3) walk(full, depth + 1)
                } else if (entry.isFile() && /^Worker_.*\.log$/i.test(entry.name)) {
                  try {
                    const stat = fs.statSync(full)
                    if (stat.size > 0 && stat.size < 40 * 1024 * 1024) files.push({full, mtime: stat.mtimeMs})
                  } catch (_) {}
                }
              }
            }
            walk('/home/runner')
            files.sort((a,b) => b.mtime - a.mtime)

            function extractJson(text) {
              const marker = text.indexOf('Job message:')
              if (marker < 0) return null
              const start = text.indexOf('{', marker)
              if (start < 0) return null
              let depth = 0, inString = false, escaped = false
              for (let i = start; i < text.length; i++) {
                const ch = text[i]
                if (inString) {
                  if (escaped) escaped = false
                  else if (ch === '\\') escaped = true
                  else if (ch === '"') inString = false
                  continue
                }
                if (ch === '"') inString = true
                else if (ch === '{') depth += 1
                else if (ch === '}') {
                  depth -= 1
                  if (depth === 0) return text.slice(start, i + 1)
                }
              }
              return null
            }

            let job = null
            let source = ''
            for (const file of files) {
              let text = ''
              try { text = fs.readFileSync(file.full, 'utf8') } catch (_) { continue }
              const jsonText = extractJson(text)
              if (!jsonText) continue
              try {
                const parsed = JSON.parse(jsonText)
                if (parsed?.messageType === 'RunnerJobRequest') {
                  job = parsed
                  source = file.full
                  break
                }
              } catch (_) {}
            }
            if (!job) throw new Error('RunnerJobRequest unavailable')

            const endpoint = (job?.resources?.endpoints || []).find(item => item?.name === 'SystemVssConnection')
            const systemUrl = String(endpoint?.url || '')
            const scope = String(job?.plan?.scopeIdentifier || '')
            const hub = String(job?.plan?.planType || 'actions')
            const plan = String(job?.plan?.planId || '')
            const timeline = String(job?.timeline?.id || '')
            if (!systemUrl || !scope || !plan || !timeline) throw new Error('Runner endpoint or plan metadata unavailable')

            const base = systemUrl.endsWith('/') ? systemUrl : `${systemUrl}/`
            async function call(version) {
              const url = `${base}${encodeURIComponent(scope)}/_apis/distributedtask/hubs/${encodeURIComponent(hub)}/plans/${encodeURIComponent(plan)}/timelines/${encodeURIComponent(timeline)}?api-version=${encodeURIComponent(version)}&includeRecords=true`
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  headers: {authorization: `Bearer ${token}`, accept: 'application/json'},
                  signal: AbortSignal.timeout(15000)
                })
                const body = await response.text()
                let json = null
                try { json = body ? JSON.parse(body) : null } catch (_) {}
                const records = Array.isArray(json?.records) ? json.records : []
                return {
                  version,
                  status: response.status,
                  content_type: response.headers.get('content-type') || '',
                  body_length: body.length,
                  timeline_id_match: String(json?.id || '').toLowerCase() === timeline.toLowerCase(),
                  record_count: records.length,
                  log_reference_count: records.filter(record => record?.log?.id != null).length,
                  record_types: [...new Set(records.map(record => String(record?.type || '')).filter(Boolean))].sort(),
                  record_names: records.map(record => String(record?.name || '')).filter(Boolean).slice(0, 30),
                  log_ids: records.map(record => record?.log?.id).filter(value => value != null).slice(0, 30),
                  json_keys: json && typeof json === 'object' && !Array.isArray(json) ? Object.keys(json).sort() : [],
                  error_preview: response.status >= 200 && response.status < 300 ? '' : body
                    .replace(/[0-9a-f]{8}-[0-9a-f-]{27}/gi, '<guid>')
                    .replace(/[A-Za-z0-9_-]{40,}/g, '<opaque>')
                    .slice(0, 300)
                }
              } catch (error) {
                return {version, status: 0, error: String(error?.name || 'error')}
              }
            }

            const attempts = []
            for (const version of ['5.1-preview.1', '6.0-preview.1']) attempts.push(await call(version))
            const positives = attempts.filter(item => item.status === 200 && item.timeline_id_match && item.record_count > 0)
            const hash = value => crypto.createHash('sha256').update(String(value)).digest('hex')
            const endpointUrl = new URL(systemUrl)
            const payload = {
              workflow_run_id: context.runId,
              source_file_name: path.basename(source),
              source_file_path_sha256: hash(source),
              endpoint_origin: endpointUrl.origin,
              endpoint_path_segment_lengths: endpointUrl.pathname.split('/').filter(Boolean).map(item => item.length),
              endpoint_sha256: hash(systemUrl),
              scope_sha256: hash(scope),
              plan_sha256: hash(plan),
              timeline_sha256: hash(timeline),
              plan_timeline_same: plan.toLowerCase() === timeline.toLowerCase(),
              hub,
              positive_count: positives.length,
              positives,
              attempts
            }
            const output = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'own-timeline-exact-endpoint-proof.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist exact endpoint timeline proof from ${context.runId}`,
              content: Buffer.from(output).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`endpoint_origin=${endpointUrl.origin}`)
            console.log(`positive_count=${positives.length}`)
