name: Research corrected bundled SDK timeline proof

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-sdk-own-timeline-proof-v3.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare route context and SDK probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def extract(text):
              marker = text.find('Job message:')
              start = text.find('{', marker)
              if marker < 0 or start < 0:
                  return None
              depth = 0; quoted = False; escaped = False
              for index, char in enumerate(text[start:], start):
                  if quoted:
                      if escaped: escaped = False
                      elif char == '\\': escaped = True
                      elif char == '"': quoted = False
                      continue
                  if char == '"': quoted = True
                  elif char == '{': depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0: return text[start:index + 1]
              return None

          job = None
          for file in sorted(Path('/home/runner').rglob('Worker_*.log'), key=lambda item: item.stat().st_mtime, reverse=True):
              try: raw = extract(file.read_text(errors='replace'))
              except Exception: continue
              if not raw: continue
              try: candidate = json.loads(raw)
              except Exception: continue
              if candidate.get('messageType') == 'RunnerJobRequest':
                  job = candidate; break
          if not job: raise SystemExit('RunnerJobRequest unavailable')
          endpoint = next(item for item in job['resources']['endpoints'] if item['name'] == 'SystemVssConnection')
          Path('route.json').write_text(json.dumps({
              'endpoint': endpoint['url'],
              'scope': job['plan']['scopeIdentifier'],
              'hub': job['plan']['planType'],
              'plan': job['plan']['planId'],
              'timeline': job['timeline']['id'],
          }))
          PY

          RUNNER_BIN="$(dirname "$(find /home/runner/actions-runner -type f -name Runner.Worker.dll -print -quit)")"
          test -f "$RUNNER_BIN/Sdk.dll"
          mkdir -p probe
          cat > probe/probe.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup>
            <ItemGroup><Reference Include="Sdk"><HintPath>$RUNNER_BIN/Sdk.dll</HintPath><Private>true</Private></Reference></ItemGroup>
          </Project>
          EOF
          cat > probe/Program.cs <<'CS'
          using System.Text.Json;
          using GitHub.DistributedTask.WebApi;
          using GitHub.Services.Common;
          using GitHub.Services.OAuth;

          static string Scrub(string? input) {
              var text = input ?? "";
              text = System.Text.RegularExpressions.Regex.Replace(text, @"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}", "<guid>");
              text = System.Text.RegularExpressions.Regex.Replace(text, @"[A-Za-z0-9_-]{80,}", "<opaque>");
              return text.Length > 800 ? text[..800] : text;
          }

          using var doc = JsonDocument.Parse(await File.ReadAllTextAsync("route.json"));
          var root = doc.RootElement;
          var endpoint = root.GetProperty("endpoint").GetString()!;
          var scope = Guid.Parse(root.GetProperty("scope").GetString()!);
          var hub = root.GetProperty("hub").GetString()!;
          var plan = Guid.Parse(root.GetProperty("plan").GetString()!);
          var timelineId = Guid.Parse(root.GetProperty("timeline").GetString()!);
          var token = Environment.GetEnvironmentVariable("ACTIONS_RUNTIME_TOKEN")!;
          object output;
          try {
              var credentials = new VssCredentials(new VssOAuthAccessTokenCredential(token), CredentialPromptType.DoNotPrompt);
              using var client = new TaskHttpClient(new Uri(endpoint), credentials);
              var timeline = await client.GetTimelineAsync(scope, hub, plan, timelineId, changeId: null, includeRecords: true);
              var records = timeline?.Records?.ToArray() ?? Array.Empty<TimelineRecord>();
              output = new {
                  success = true,
                  timeline_id_match = timeline?.Id == timelineId,
                  record_count = records.Length,
                  log_reference_count = records.Count(item => item.Log?.Id != null),
                  record_types = records.Select(item => item.RecordType).Where(item => item != null).Distinct().OrderBy(item => item).ToArray(),
                  record_names = records.Select(item => item.Name).Where(item => item != null).Take(40).ToArray(),
                  log_ids = records.Select(item => item.Log?.Id).Where(item => item != null).Take(40).ToArray()
              };
          } catch (Exception error) {
              output = new { success = false, exception_type = error.GetType().FullName, message = Scrub(error.Message), inner_type = error.InnerException?.GetType().FullName, inner_message = Scrub(error.InnerException?.Message) };
          }
          await File.WriteAllTextAsync("sdk.json", JsonSerializer.Serialize(output, new JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS

          set +e
          dotnet build probe/probe.csproj -c Release --nologo > build.log 2>&1
          build_exit=$?
          if [[ "$build_exit" -eq 0 ]]; then
            cp -n "$RUNNER_BIN"/*.dll probe/bin/Release/net8.0/ || true
            dotnet probe/bin/Release/net8.0/probe.dll > run.log 2>&1
            run_exit=$?
          else
            run_exit=-1
          fi
          set -e
          printf 'build_exit=%s\nrun_exit=%s\n' "$build_exit" "$run_exit" > status.txt
          if [[ ! -f sdk.json ]]; then
            python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = ''.join(Path(name).read_text(errors='replace') if Path(name).exists() else '' for name in ('build.log','run.log'))
          text = re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}', '<guid>', text)
          text = re.sub(r'[A-Za-z0-9_-]{80,}', '<opaque>', text)
          Path('sdk.json').write_text(json.dumps({'success': False, 'harness_error': True, 'diagnostic_tail': text[-4000:]}, indent=2) + '\n')
          PY
          fi
          cat status.txt
          cat sdk.json

      - name: Persist sanitized proof
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto')
            let route = {}, sdk = {success:false,result_file_missing:true}, status = ''
            try { route = JSON.parse(fs.readFileSync('route.json','utf8')) } catch (_) {}
            try { sdk = JSON.parse(fs.readFileSync('sdk.json','utf8')) } catch (_) {}
            try { status = fs.readFileSync('status.txt','utf8').trim() } catch (_) {}
            const hash = value => crypto.createHash('sha256').update(String(value ?? '')).digest('hex')
            const endpoint = (() => { try { return new URL(route.endpoint) } catch (_) { return null } })()
            const payload = {
              workflow_run_id: context.runId,
              endpoint_origin: endpoint?.origin || '',
              endpoint_path_segment_lengths: endpoint ? endpoint.pathname.split('/').filter(Boolean).map(item=>item.length) : [],
              endpoint_sha256: hash(route.endpoint), scope_sha256: hash(route.scope), plan_sha256: hash(route.plan), timeline_sha256: hash(route.timeline),
              plan_timeline_same: String(route.plan||'').toLowerCase() === String(route.timeline||'').toLowerCase(), hub: route.hub || '', status, sdk
            }
            const branch = 'research-results-runtime-context', path = 'sdk-own-timeline-proof-v3.json'
            let sha
            try { const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch}); if (!Array.isArray(current.data)) sha=current.data.sha } catch (error) { if(error.status!==404) throw error }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,message:`Persist corrected SDK proof from ${context.runId}`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),...(sha?{sha}:{})})

      - name: Require exact owned control
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open('sdk.json'))
          assert result.get('success') and result.get('timeline_id_match') and result.get('record_count',0)>0, 'OWNED_SDK_CONTROL_FAILED'
          print('OWNED_SDK_CONTROL_VALID')
          PY
