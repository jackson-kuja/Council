name: Research runtime claim details

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-runtime-claim-details.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist redacted authorization-claim structure
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            const hash = value => crypto.createHash('sha256').update(String(value ?? '')).digest('hex')
            const pattern = value => String(value ?? '')
              .replace(/[A-Fa-f]/g, 'h')
              .replace(/[G-Zg-z]/g, 'a')
              .replace(/[0-9]/g, '9')
            function describe(value) {
              if (Array.isArray(value)) return {type: 'array', length: value.length, items: value.slice(0, 20).map(describe)}
              if (value && typeof value === 'object') return {type: 'object', entries: Object.fromEntries(Object.entries(value).map(([k,v]) => [k, describe(v)]))}
              const text = String(value ?? '')
              return {type: typeof value, length: text.length, pattern: pattern(text), sha256: hash(text)}
            }
            let acParsed = null
            let acParseError = null
            try { acParsed = JSON.parse(String(claims.ac || '')) } catch (error) { acParseError = String(error?.name || 'error') }
            const payload = {
              workflow_run_id: context.runId,
              ac: acParsed === null ? {parse_error: acParseError, raw: describe(claims.ac)} : describe(acParsed),
              orch_id: describe(claims.orch_id),
              audience: describe(claims.aud),
              identity: describe(claims.nameid),
              plan_id: describe(claims.plan_id),
              job_id: describe(claims.job_id)
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const path = 'runtime-claim-details.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist runtime claim details from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
