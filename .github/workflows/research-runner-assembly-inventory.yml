name: Research runner SDK assembly inventory

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-runner-assembly-inventory.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist non-sensitive assembly names and runtime targets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const crypto = require('crypto')
            const roots = ['/home/runner/actions-runner']
            const entries = []
            function walk(root, depth = 0) {
              if (depth > 8) return
              let children = []
              try { children = fs.readdirSync(root, {withFileTypes: true}) } catch (_) { return }
              for (const child of children) {
                const full = path.join(root, child.name)
                if (child.isDirectory()) walk(full, depth + 1)
                else if (child.isFile() && /\.dll$/i.test(child.name) && /(Runner|GitHub|Newtonsoft|WebApi|OAuth|DistributedTask|Services)/i.test(child.name)) {
                  entries.push({
                    name: child.name,
                    parent_name: path.basename(path.dirname(full)),
                    path_sha256: crypto.createHash('sha256').update(full).digest('hex'),
                    size: fs.statSync(full).size
                  })
                }
              }
            }
            for (const root of roots) walk(root)
            entries.sort((a,b) => a.name.localeCompare(b.name) || a.size - b.size)
            const payload = {
              workflow_run_id: context.runId,
              assembly_count: entries.length,
              names: [...new Set(entries.map(item => item.name))],
              entries
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'runner-assembly-inventory.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist runner assembly inventory from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`assembly_count=${entries.length}`)
