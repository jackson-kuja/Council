name: Research bundled Sdk.dll own timeline proof

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-sdk-own-timeline-proof-v2.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Parse the owned RunnerJobRequest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const files = []
            function walk(root, depth = 0) {
              if (depth > 7) return
              let entries = []
              try { entries = fs.readdirSync(root, {withFileTypes: true}) } catch (_) { return }
              for (const entry of entries) {
                const full = path.join(root, entry.name)
                if (entry.isDirectory()) {
                  if (/(_diag|runner|work|temp)/i.test(full) || depth < 3) walk(full, depth + 1)
                } else if (entry.isFile() && /^Worker_.*\.log$/i.test(entry.name)) {
                  try { files.push({full, mtime: fs.statSync(full).mtimeMs}) } catch (_) {}
                }
              }
            }
            walk('/home/runner')
            files.sort((a,b) => b.mtime - a.mtime)

            function extractJson(text) {
              const marker = text.indexOf('Job message:')
              if (marker < 0) return null
              const start = text.indexOf('{', marker)
              if (start < 0) return null
              let depth = 0, inString = false, escaped = false
              for (let i = start; i < text.length; i++) {
                const ch = text[i]
                if (inString) {
                  if (escaped) escaped = false
                  else if (ch === '\\') escaped = true
                  else if (ch === '"') inString = false
                  continue
                }
                if (ch === '"') inString = true
                else if (ch === '{') depth += 1
                else if (ch === '}') {
                  depth -= 1
                  if (depth === 0) return text.slice(start, i + 1)
                }
              }
              return null
            }

            let job = null
            for (const file of files) {
              let text = ''
              try { text = fs.readFileSync(file.full, 'utf8') } catch (_) { continue }
              const raw = extractJson(text)
              if (!raw) continue
              try {
                const parsed = JSON.parse(raw)
                if (parsed?.messageType === 'RunnerJobRequest') {
                  job = parsed
                  break
                }
              } catch (_) {}
            }
            if (!job) throw new Error('RunnerJobRequest unavailable')
            const endpoint = (job?.resources?.endpoints || []).find(item => item?.name === 'SystemVssConnection')
            if (!endpoint?.url) throw new Error('SystemVssConnection unavailable')
            fs.writeFileSync('route-context.json', JSON.stringify({
              endpoint: endpoint.url,
              scope: job.plan.scopeIdentifier,
              hub: job.plan.planType,
              plan: job.plan.planId,
              timeline: job.timeline.id
            }))
            console.log('route_context_valid=true')

      - name: Build and execute the shipped SDK client
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_BIN="$(dirname "$(find /home/runner/actions-runner -type f -name 'Runner.Worker.dll' -print -quit)")"
          test -f "$RUNNER_BIN/Sdk.dll"
          printf 'runner_bin_sha256=%s\n' "$(printf '%s' "$RUNNER_BIN" | sha256sum | cut -d' ' -f1)"
          printf 'sdk_dll_present=true\n'

          mkdir -p sdkprobe
          cat > sdkprobe/SdkProbe.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="Sdk"><HintPath>$RUNNER_BIN/Sdk.dll</HintPath><Private>true</Private></Reference>
            </ItemGroup>
          </Project>
          EOF

          cat > sdkprobe/Program.cs <<'CS'
          using System.Text.Json;
          using GitHub.DistributedTask.WebApi;
          using GitHub.Services.Common;

          static string Clean(string? value)
          {
              if (string.IsNullOrEmpty(value)) return string.Empty;
              var clean = System.Text.RegularExpressions.Regex.Replace(
                  value,
                  @"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
                  "<guid>"
              );
              clean = System.Text.RegularExpressions.Regex.Replace(clean, @"[A-Za-z0-9_-]{80,}", "<opaque>");
              return clean.Length > 500 ? clean[..500] : clean;
          }

          using var document = JsonDocument.Parse(await File.ReadAllTextAsync("route-context.json"));
          var root = document.RootElement;
          var endpoint = root.GetProperty("endpoint").GetString()!;
          var scope = Guid.Parse(root.GetProperty("scope").GetString()!);
          var hub = root.GetProperty("hub").GetString()!;
          var plan = Guid.Parse(root.GetProperty("plan").GetString()!);
          var timelineId = Guid.Parse(root.GetProperty("timeline").GetString()!);
          var token = Environment.GetEnvironmentVariable("ACTIONS_RUNTIME_TOKEN")!;

          object result;
          try
          {
              var credentials = new VssCredentials(
                  new VssOAuthAccessTokenCredential(token),
                  CredentialPromptType.DoNotPrompt
              );
              using var client = new TaskHttpClient(new Uri(endpoint), credentials);
              var timeline = await client.GetTimelineAsync(
                  scope,
                  hub,
                  plan,
                  timelineId,
                  changeId: null,
                  includeRecords: true
              );
              var records = timeline?.Records?.ToArray() ?? Array.Empty<TimelineRecord>();
              result = new
              {
                  success = true,
                  timeline_id_match = timeline?.Id == timelineId,
                  record_count = records.Length,
                  log_reference_count = records.Count(record => record.Log?.Id != null),
                  record_types = records.Select(record => record.RecordType).Where(value => value != null).Distinct().OrderBy(value => value).ToArray(),
                  record_names = records.Select(record => record.Name).Where(value => value != null).Take(30).ToArray(),
                  log_ids = records.Select(record => record.Log?.Id).Where(value => value != null).Take(30).ToArray()
              };
          }
          catch (Exception error)
          {
              result = new
              {
                  success = false,
                  exception_type = error.GetType().FullName,
                  message = Clean(error.Message),
                  inner_type = error.InnerException?.GetType().FullName,
                  inner_message = Clean(error.InnerException?.Message)
              };
          }
          await File.WriteAllTextAsync(
              "sdk-result.json",
              JsonSerializer.Serialize(result, new JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine
          );
          CS

          set +e
          dotnet build sdkprobe/SdkProbe.csproj -c Release --nologo > sdk-build.log 2>&1
          build_exit=$?
          set -e
          printf 'build_exit=%s\n' "$build_exit" > sdk-status.txt
          if [[ "$build_exit" -eq 0 ]]; then
            OUT=sdkprobe/bin/Release/net8.0
            cp -n "$RUNNER_BIN"/*.dll "$OUT"/ || true
            set +e
            dotnet "$OUT/SdkProbe.dll" > sdk-run.log 2>&1
            run_exit=$?
            set -e
            printf 'run_exit=%s\n' "$run_exit" >> sdk-status.txt
          else
            printf 'run_exit=-1\n' >> sdk-status.txt
          fi

          if [[ ! -f sdk-result.json ]]; then
            python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = ''
          for name in ('sdk-build.log', 'sdk-run.log'):
              if Path(name).exists():
                  text += Path(name).read_text(errors='replace') + '\n'
          text = re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}', '<guid>', text)
          text = re.sub(r'[A-Za-z0-9_-]{80,}', '<opaque>', text)
          Path('sdk-result.json').write_text(json.dumps({
              'success': False,
              'harness_error': True,
              'diagnostic_tail': text[-3000:]
          }, indent=2) + '\n')
          PY
          fi
          cat sdk-status.txt
          cat sdk-result.json

      - name: Persist sanitized SDK proof
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const crypto = require('crypto')
            let route = {}
            let sdk = {success: false, result_file_missing: true}
            let status = ''
            try { route = JSON.parse(fs.readFileSync('route-context.json', 'utf8')) } catch (_) {}
            try { sdk = JSON.parse(fs.readFileSync('sdk-result.json', 'utf8')) } catch (_) {}
            try { status = fs.readFileSync('sdk-status.txt', 'utf8').trim() } catch (_) {}
            const hash = value => crypto.createHash('sha256').update(String(value ?? '')).digest('hex')
            const endpoint = (() => { try { return new URL(route.endpoint) } catch (_) { return null } })()
            const payload = {
              workflow_run_id: context.runId,
              endpoint_origin: endpoint?.origin || '',
              endpoint_path_segment_lengths: endpoint ? endpoint.pathname.split('/').filter(Boolean).map(item => item.length) : [],
              endpoint_sha256: hash(route.endpoint),
              scope_sha256: hash(route.scope),
              plan_sha256: hash(route.plan),
              timeline_sha256: hash(route.timeline),
              plan_timeline_same: String(route.plan || '').toLowerCase() === String(route.timeline || '').toLowerCase(),
              hub: route.hub || '',
              status,
              sdk
            }
            const output = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'sdk-own-timeline-proof-v2.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist bundled SDK proof from ${context.runId}`,
              content: Buffer.from(output).toString('base64'),
              ...(sha ? {sha} : {})
            })

      - name: Fail closed unless the owned SDK control is exact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('sdk-result.json').read_text())
          if not (result.get('success') and result.get('timeline_id_match') and result.get('record_count', 0) > 0):
              raise SystemExit('OWNED_BUNDLED_SDK_CONTROL_FAILED')
          print('OWNED_BUNDLED_SDK_CONTROL_VALID')
          PY
