name: Research legacy Actions route discovery branch

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-legacy-runtime-route-branch.yml
      - research-legacy-route-trigger.txt

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover authenticated own-plan routes without exposing identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const runtimeUrl = process.env.ACTIONS_RUNTIME_URL || ''
            if (!token || !runtimeUrl) throw new Error('Actions runtime context unavailable')

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            const planId = String(claims.plan_id || '')
            if (!/^[0-9a-f-]{36}$/i.test(planId)) throw new Error('plan_id unavailable')

            const base = runtimeUrl.endsWith('/') ? runtimeUrl : `${runtimeUrl}/`
            const origin = new URL(runtimeUrl).origin + '/'
            const attempts = []

            async function request(label, url) {
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  headers: {authorization: `Bearer ${token}`, accept: 'application/json'},
                  signal: AbortSignal.timeout(15000)
                })
                const text = await response.text()
                let json = null
                try { json = text ? JSON.parse(text) : null } catch (_) {}
                attempts.push({
                  label,
                  status: response.status,
                  content_type: response.headers.get('content-type') || '',
                  body_length: text.length,
                  body_plan_match: text.toLowerCase().includes(planId.toLowerCase()),
                  json_keys: json && typeof json === 'object' && !Array.isArray(json) ? Object.keys(json).sort().slice(0, 30) : []
                })
              } catch (error) {
                attempts.push({label, status: 0, error: String(error?.name || 'error')})
              }
            }

            await request('connection-data-context', `${base}_apis/connectionData?connectOptions=1&lastChangeId=-1&lastChangeId64=-1`)
            await request('connection-data-origin', `${origin}_apis/connectionData?connectOptions=1&lastChangeId=-1&lastChangeId64=-1`)
            await request('old-plan-context-v1', `${base}_apis/distributedtask/plans/${encodeURIComponent(planId)}?api-version=1.0`)
            await request('old-plan-context-v51', `${base}_apis/distributedtask/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.1`)
            await request('old-timelines-context-v1', `${base}_apis/distributedtask/plans/${encodeURIComponent(planId)}/timelines?api-version=1.0`)

            const fixedScopes = new Map()
            fixedScopes.set('zero', '00000000-0000-0000-0000-000000000000')
            for (const name of ['nameid', 'plan_id', 'job_id']) {
              const value = String(claims[name] || '')
              if (value) fixedScopes.set(name, value)
            }
            const audienceMatch = /([0-9a-f]{8}-[0-9a-f-]{27})/i.exec(String(claims.aud || ''))
            if (audienceMatch) fixedScopes.set('audience-guid', audienceMatch[1])
            try {
              for (const entry of JSON.parse(String(claims.ac || '[]'))) {
                const scope = String(entry?.Scope || '')
                for (const segment of scope.split('/').filter(Boolean)) {
                  if (/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(segment)) fixedScopes.set('ac-guid', segment)
                }
              }
            } catch (_) {}

            for (const [scopeName, scope] of fixedScopes) {
              for (const hub of ['build', 'rm', 'actions', 'checks']) {
                await request(
                  `scoped-plan-${scopeName}-${hub}-v51`,
                  `${base}${encodeURIComponent(scope)}/_apis/distributedtask/hubs/${hub}/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.2`
                )
              }
            }
            for (const hub of ['build', 'rm', 'actions', 'checks']) {
              await request(
                `unscoped-hub-plan-${hub}-v51`,
                `${base}_apis/distributedtask/hubs/${hub}/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.2`
              )
            }

            const positives = attempts.filter(item => item.status >= 200 && item.status < 300)
            const payload = {
              workflow_run_id: context.runId,
              runtime_origin: new URL(runtimeUrl).origin,
              runtime_path_segment_lengths: new URL(runtimeUrl).pathname.split('/').filter(Boolean).map(item => item.length),
              plan_id_sha256: crypto.createHash('sha256').update(planId).digest('hex'),
              positive_count: positives.length,
              positives,
              attempts
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const path = 'legacy-route-discovery.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist expanded legacy route discovery from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`positive_count=${positives.length}`)
            for (const item of positives) console.log(`positive=${item.label}/${item.status}`)
