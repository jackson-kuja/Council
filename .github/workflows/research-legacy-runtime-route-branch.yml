name: Research legacy Actions route discovery branch

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-legacy-runtime-route-branch.yml
      - research-legacy-route-trigger.txt

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover the own-plan Actions.Runner route without exposing identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const runtimeUrl = process.env.ACTIONS_RUNTIME_URL || ''
            if (!token || !runtimeUrl) throw new Error('Actions runtime context unavailable')

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            const planId = String(claims.plan_id || '')
            if (!/^[0-9a-f-]{36}$/i.test(planId)) throw new Error('plan_id unavailable')

            const guid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
            const claimCandidates = []
            for (const [name, value] of Object.entries(claims)) {
              if (typeof value === 'string' && guid.test(value)) claimCandidates.push({name, value})
            }
            for (const entry of String(claims.scp || '').split(/\s+/).filter(Boolean)) {
              const pieces = entry.split(':')
              for (let i = 1; i < pieces.length; i++) {
                if (guid.test(pieces[i])) claimCandidates.push({name: `scp:${pieces[0]}:${i}`, value: pieces[i]})
              }
            }

            const dedup = new Map()
            for (const item of claimCandidates) dedup.set(`${item.name}:${item.value}`, item)
            const hubs = ['build', 'actions', 'github', 'checks']
            const base = runtimeUrl.endsWith('/') ? runtimeUrl : `${runtimeUrl}/`
            const attempts = []

            async function request(url) {
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  headers: {authorization: `Bearer ${token}`, accept: 'application/json'},
                  signal: AbortSignal.timeout(15000)
                })
                const text = await response.text()
                let json = null
                try { json = text ? JSON.parse(text) : null } catch (_) {}
                return {
                  status: response.status,
                  content_type: response.headers.get('content-type') || '',
                  body_length: text.length,
                  body_plan_match: text.toLowerCase().includes(planId.toLowerCase()),
                  json_keys: json && typeof json === 'object' && !Array.isArray(json) ? Object.keys(json).sort().slice(0, 20) : []
                }
              } catch (error) {
                return {status: 0, error: String(error?.name || 'error')}
              }
            }

            for (const item of dedup.values()) {
              for (const hub of hubs) {
                const url = `${base}${encodeURIComponent(item.value)}/_apis/distributedtask/hubs/${hub}/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.2`
                attempts.push({
                  claim: item.name,
                  claim_sha256: crypto.createHash('sha256').update(item.value).digest('hex'),
                  hub,
                  ...(await request(url))
                })
              }
            }

            const positives = attempts.filter(item => item.status === 200)
            const payload = {
              workflow_run_id: context.runId,
              runtime_origin: new URL(runtimeUrl).origin,
              plan_id_sha256: crypto.createHash('sha256').update(planId).digest('hex'),
              candidate_count: dedup.size,
              positive_count: positives.length,
              positives,
              attempts
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const path = 'legacy-route-discovery.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist legacy route discovery from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`positive_count=${positives.length}`)
            for (const item of positives) console.log(`positive=${item.claim}/${item.hub}`)
