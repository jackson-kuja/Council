name: Research legacy Actions route discovery branch

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-legacy-runtime-route-branch.yml
      - research-legacy-route-trigger.txt

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover authenticated own-plan routes without exposing identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const runtimeUrl = process.env.ACTIONS_RUNTIME_URL || ''
            if (!token || !runtimeUrl) throw new Error('Actions runtime context unavailable')

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            const planId = String(claims.plan_id || '')
            if (!/^[0-9a-f-]{36}$/i.test(planId)) throw new Error('plan_id unavailable')

            const runtimeBase = runtimeUrl.endsWith('/') ? runtimeUrl : `${runtimeUrl}/`
            const originBase = new URL(runtimeUrl).origin + '/'
            const attempts = []
            const hash = value => crypto.createHash('sha256').update(String(value)).digest('hex')
            const redact = text => String(text || '')
              .replaceAll(planId, '<plan-id>')
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '<guid>')
              .replace(/[A-Za-z0-9_-]{32,}/g, '<opaque>')
              .replace(/\b\d{6,}\b/g, '<number>')
              .slice(0, 300)

            async function fetchResult(url) {
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  headers: {authorization: `Bearer ${token}`, accept: 'application/json'},
                  signal: AbortSignal.timeout(15000)
                })
                const text = await response.text()
                let json = null
                try { json = text ? JSON.parse(text) : null } catch (_) {}
                return {response, text, json}
              } catch (error) {
                return {error}
              }
            }

            async function record(label, baseLabel, url) {
              const result = await fetchResult(url)
              if (result.error) {
                attempts.push({label, base: baseLabel, status: 0, error: String(result.error?.name || 'error')})
                return result
              }
              const {response, text, json} = result
              attempts.push({
                label,
                base: baseLabel,
                status: response.status,
                content_type: response.headers.get('content-type') || '',
                body_length: text.length,
                body_plan_match: text.toLowerCase().includes(planId.toLowerCase()),
                body_preview: response.status >= 200 && response.status < 300 ? '' : redact(text),
                json_keys: json && typeof json === 'object' && !Array.isArray(json) ? Object.keys(json).sort().slice(0, 30) : []
              })
              return result
            }

            const connection = await record(
              'connection-data',
              'origin',
              `${originBase}_apis/connectionData?connectOptions=1&lastChangeId=-1&lastChangeId64=-1`
            )

            const bases = new Map()
            function addBase(label, value) {
              try {
                const url = new URL(value)
                if (!/^https:$/.test(url.protocol)) return
                const normalized = url.toString().endsWith('/') ? url.toString() : `${url.toString()}/`
                if (![...bases.values()].includes(normalized)) bases.set(label, normalized)
              } catch (_) {}
            }
            addBase('runtime', runtimeBase)
            addBase('origin', originBase)

            const locationData = connection?.json?.locationServiceData || {}
            for (const mapping of locationData.accessMappings || []) {
              addBase(`mapping-${mapping.moniker || mapping.displayName || bases.size}`, mapping.accessPoint || mapping.AccessPoint || '')
            }
            for (const definition of locationData.serviceDefinitions || []) {
              for (const mapping of definition.locationMappings || definition.LocationMappings || []) {
                addBase(`service-${definition.identifier || definition.Identifier || bases.size}`, mapping.location || mapping.Location || '')
              }
            }

            const scopes = new Map()
            scopes.set('zero', '00000000-0000-0000-0000-000000000000')
            for (const name of ['nameid', 'plan_id', 'job_id']) {
              const value = String(claims[name] || '')
              if (value) scopes.set(name, value)
            }
            const audienceMatch = /([0-9a-f]{8}-[0-9a-f-]{27})/i.exec(String(claims.aud || ''))
            if (audienceMatch) scopes.set('audience-guid', audienceMatch[1])
            for (const name of ['instanceId', 'deploymentId']) {
              const value = String(connection?.json?.[name] || '')
              if (/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(value)) scopes.set(`connection-${name}`, value)
            }
            try {
              for (const entry of JSON.parse(String(claims.ac || '[]'))) {
                for (const segment of String(entry?.Scope || '').split('/').filter(Boolean)) {
                  if (/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(segment)) scopes.set('ac-guid', segment)
                }
              }
            } catch (_) {}

            const selectedBases = [...bases.entries()].slice(0, 8)
            for (const [baseLabel, baseUrl] of selectedBases) {
              await record(
                'old-plan-v1',
                baseLabel,
                `${baseUrl}_apis/distributedtask/plans/${encodeURIComponent(planId)}?api-version=1.0`
              )
              await record(
                'old-plan-v51',
                baseLabel,
                `${baseUrl}_apis/distributedtask/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.1`
              )
              for (const [scopeName, scope] of scopes) {
                await record(
                  `scoped-plan-${scopeName}-build-v51`,
                  baseLabel,
                  `${baseUrl}${encodeURIComponent(scope)}/_apis/distributedtask/hubs/build/plans/${encodeURIComponent(planId)}?api-version=5.1-preview.2`
                )
              }
            }

            const positives = attempts.filter(item => item.status >= 200 && item.status < 300)
            const payload = {
              workflow_run_id: context.runId,
              runtime_origin: new URL(runtimeUrl).origin,
              runtime_path_segment_lengths: new URL(runtimeUrl).pathname.split('/').filter(Boolean).map(item => item.length),
              plan_id_sha256: hash(planId),
              discovered_bases: selectedBases.map(([label, value]) => ({
                label,
                origin: new URL(value).origin,
                path_segment_lengths: new URL(value).pathname.split('/').filter(Boolean).map(item => item.length),
                value_sha256: hash(value)
              })),
              scope_labels: [...scopes.keys()],
              positive_count: positives.length,
              positives,
              attempts
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const path = 'legacy-route-discovery.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist access-mapping route discovery from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`base_count=${selectedBases.length}`)
            console.log(`positive_count=${positives.length}`)
            for (const item of positives) console.log(`positive=${item.base}/${item.label}/${item.status}`)
