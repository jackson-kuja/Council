name: Research runner diagnostic route patterns

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-runner-diag-route.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract only redacted Actions service route patterns from owned runner diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            const known = new Map([
              [String(claims.plan_id || '').toLowerCase(), '<plan-id>'],
              [String(claims.job_id || '').toLowerCase(), '<job-id>'],
              [String(claims.nameid || '').toLowerCase(), '<identity-id>']
            ])
            const runtimePath = new URL(process.env.ACTIONS_RUNTIME_URL).pathname.split('/').filter(Boolean)[0] || ''
            if (runtimePath) known.set(runtimePath.toLowerCase(), '<runtime-path>')

            function redact(line) {
              let out = String(line)
              for (const [value, replacement] of known) {
                if (value) out = out.replaceAll(value, replacement).replaceAll(value.toUpperCase(), replacement)
              }
              out = out
                .replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, 'Bearer <redacted>')
                .replace(/[A-Za-z0-9_-]{80,}/g, '<opaque>')
                .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '<guid>')
              return out.slice(0, 1000)
            }

            const roots = ['/home/runner', '/opt/hostedtoolcache', process.env.RUNNER_TEMP || '']
            const candidates = []
            const seen = new Set()
            function walk(root, depth = 0) {
              if (!root || depth > 7 || seen.size > 20000) return
              let entries = []
              try { entries = fs.readdirSync(root, {withFileTypes: true}) } catch (_) { return }
              for (const entry of entries) {
                const full = path.join(root, entry.name)
                if (seen.has(full)) continue
                seen.add(full)
                if (entry.isDirectory()) {
                  if (/(_diag|runner|actions|work|temp)/i.test(full) || depth < 3) walk(full, depth + 1)
                } else if (entry.isFile() && /(?:Worker|Runner|Host|diag).*\.(?:log|txt)$/i.test(entry.name)) {
                  try {
                    const stat = fs.statSync(full)
                    if (stat.size > 0 && stat.size <= 25 * 1024 * 1024) candidates.push({full, size: stat.size, mtime: stat.mtimeMs})
                  } catch (_) {}
                }
              }
            }
            for (const root of roots) walk(root)
            candidates.sort((a,b) => b.mtime - a.mtime)

            const patterns = [
              /_apis\/distributedtask/i,
              /scopeidentifier/i,
              /planid/i,
              /timelineid/i,
              /actions\.runner/i,
              /connectiondata/i
            ]
            const matches = []
            for (const file of candidates.slice(0, 50)) {
              let text = ''
              try { text = fs.readFileSync(file.full, 'utf8') } catch (_) { continue }
              const lines = text.split(/\r?\n/)
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i]
                if (patterns.some(pattern => pattern.test(line))) {
                  matches.push({
                    file_name: path.basename(file.full),
                    file_path_sha256: crypto.createHash('sha256').update(file.full).digest('hex'),
                    line_number: i + 1,
                    redacted: redact(line)
                  })
                  if (matches.length >= 200) break
                }
              }
              if (matches.length >= 200) break
            }

            const payload = {
              workflow_run_id: context.runId,
              candidate_file_count: candidates.length,
              inspected_file_count: Math.min(candidates.length, 50),
              match_count: matches.length,
              matches
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const resultPath = 'runner-diag-route-patterns.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: resultPath, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: resultPath,
              branch,
              message: `Persist redacted runner route diagnostics from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
            console.log(`candidate_file_count=${candidates.length}`)
            console.log(`match_count=${matches.length}`)
