name: GHBB global open deleted-fork PR sampler

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Search globally for open PRs with missing head repositories
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const {spawnSync} = require('child_process')
            const queries = [
              'is:pr is:open archived:false sort:updated-desc',
              'is:pr is:open draft:true archived:false sort:updated-desc',
              'is:pr is:open label:preview archived:false sort:updated-desc'
            ]
            const inspected = []
            const matches = []
            const seen = new Set()

            function retainedRef(fullName, number) {
              const result = spawnSync('git', [
                'ls-remote',
                `https://github.com/${fullName}.git`,
                `refs/pull/${number}/head`
              ], {encoding: 'utf8', timeout: 20000})
              const output = result.status === 0 ? result.stdout.trim() : ''
              const sha = /^([0-9a-f]{40}|[0-9a-f]{64})\s/.exec(output)?.[1] || null
              return {exit: result.status === null ? -1 : result.status, sha}
            }

            async function inspectNode(node) {
              if (!node || node.__typename !== 'PullRequest') return
              const key = `${node.repository.nameWithOwner}#${node.number}`
              if (seen.has(key)) return
              seen.add(key)
              inspected.push(key)
              if (node.headRepository !== null) return
              const retained = retainedRef(node.repository.nameWithOwner, node.number)
              matches.push({
                repository: node.repository.nameWithOwner,
                number: node.number,
                url: node.url,
                state: node.state,
                is_draft: node.isDraft,
                created_at: node.createdAt,
                updated_at: node.updatedAt,
                author_login: node.author?.login || null,
                head_ref_name: node.headRefName,
                head_ref_oid: node.headRefOid,
                head_repository_is_null: true,
                pull_ref_exit: retained.exit,
                pull_ref_sha: retained.sha,
                pull_ref_matches_head_oid: Boolean(retained.sha && retained.sha === node.headRefOid)
              })
            }

            const queryDocument = `
              query($query: String!, $cursor: String) {
                search(query: $query, type: ISSUE, first: 100, after: $cursor) {
                  issueCount
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    __typename
                    ... on PullRequest {
                      number
                      url
                      state
                      isDraft
                      createdAt
                      updatedAt
                      headRefName
                      headRefOid
                      author { login }
                      headRepository { nameWithOwner }
                      repository { nameWithOwner }
                    }
                  }
                }
              }
            `

            for (const searchQuery of queries) {
              let cursor = null
              let pages = 0
              do {
                const data = await github.graphql(queryDocument, {query: searchQuery, cursor})
                const search = data.search
                for (const node of search.nodes || []) await inspectNode(node)
                cursor = search.pageInfo.hasNextPage ? search.pageInfo.endCursor : null
                pages += 1
              } while (cursor && pages < 10 && matches.length < 50)
              if (matches.length >= 50) break
            }

            const exact = matches.filter(item => item.pull_ref_matches_head_oid)
            const result = {inspected_count: inspected.length, matches}
            fs.writeFileSync('global-open-deleted-fork-samples.json', JSON.stringify(result, null, 2) + '\n')

            const representative = exact[0] || matches[0] || null
            const lines = [
              '<!-- ghbb-global-open-deleted-fork-sampler -->',
              `GHBB global open deleted-fork sampling for run ${context.runId}:`,
              `- unique_open_prs_inspected: \`${inspected.length}\``,
              `- open_prs_with_null_head_repository: \`${matches.length}\``,
              `- open_prs_with_exact_retained_pull_ref: \`${exact.length}\``
            ]
            if (representative) {
              for (const [key, value] of Object.entries(representative)) {
                lines.push(`- representative_${key}: \`${value}\``)
              }
            }
            lines.push('- only public PR and Git ref metadata was queried')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            })

      - name: Upload sanitized global open PR samples
        uses: actions/upload-artifact@v7
        with:
          name: ghbb-global-open-deleted-fork-samples-${{ github.run_id }}
          path: global-open-deleted-fork-samples.json
          retention-days: 1
          if-no-files-found: error
