name: GHBB privileged workflow_run merge-SHA proof

on:
  workflow_run:
    workflows: [GHBB unprivileged fork upstream]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

jobs:
  prove:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Record native event boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'workflow_run_event=%s\n' \
              '${{ github.event.workflow_run.event }}'
            printf 'workflow_run_head_repository=%s\n' \
              '${{ github.event.workflow_run.head_repository.full_name }}'
            printf 'workflow_run_head_repository_id=%s\n' \
              '${{ github.event.workflow_run.head_repository.id }}'
            printf 'base_repository=%s\n' \
              '${{ github.event.repository.full_name }}'
            printf 'base_repository_id=%s\n' \
              '${{ github.event.repository.id }}'
            printf 'workflow_run_head_sha=%s\n' \
              '${{ github.event.workflow_run.head_sha }}'
            printf 'workflow_run_id=%s\n' \
              '${{ github.event.workflow_run.id }}'
          } | tee native-event-summary.txt

      - name: Resolve the associated fork PR and merge SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run
            const base = context.payload.repository
            if (!wr?.head_repository?.id || wr.head_repository.id === base.id) {
              core.setFailed('Expected a fork-originated workflow_run')
              return
            }

            const associatedByCommit = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: wr.head_sha,
                per_page: 100
              }
            )

            const headOwner = wr.head_repository.owner?.login ||
              wr.head_repository.full_name?.split('/')[0]
            if (!headOwner || !wr.head_branch) {
              core.setFailed('Fork owner or head branch missing from workflow_run')
              return
            }

            const associatedByHead = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headOwner}:${wr.head_branch}`,
                per_page: 100
              }
            )

            const candidates = [
              ...(wr.pull_requests || []),
              ...associatedByCommit,
              ...associatedByHead
            ]
            const candidate = candidates.find(pr =>
              pr.state !== 'closed' &&
              pr.head?.sha === wr.head_sha &&
              pr.base?.repo?.id === base.id &&
              pr.head?.repo?.id === wr.head_repository.id
            )

            if (!candidate) {
              core.setFailed('No associated open fork PR found')
              return
            }

            let fullCandidate = candidate
            for (let attempt = 0; attempt < 5; attempt++) {
              const {data: refreshed} = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number
              })
              fullCandidate = refreshed
              if (fullCandidate.merge_commit_sha) break
              await new Promise(resolve => setTimeout(resolve, 2000))
            }

            const mergeSha = fullCandidate.merge_commit_sha
            if (!/^[0-9a-f]{40}$/i.test(mergeSha || '')) {
              core.setFailed('PR merge_commit_sha was unavailable')
              return
            }

            core.setOutput('number', String(fullCandidate.number))
            core.setOutput('head_sha', wr.head_sha)
            core.setOutput('merge_sha', mergeSha)
            core.info(`Resolved controlled fork PR #${fullCandidate.number}`)
            core.info(`Fork head SHA: ${wr.head_sha}`)
            core.info(`Base-side PR merge SHA: ${mergeSha}`)

      - name: Positive control - fork head SHA must be refused
        id: head_control
        continue-on-error: true
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: head-control
          persist-credentials: false

      - name: Bypass candidate - raw PR merge SHA with default protection
        id: merge_checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pr.outputs.merge_sha }}
          path: merge-candidate
          persist-credentials: false

      - name: Execute only the controlled PR payload
        id: payload
        shell: bash
        env:
          EXPECTED_MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          GHBB_DUMMY_SECRET: ${{ secrets.GHBB_DUMMY_SECRET }}
          GH_TOKEN: ${{ github.token }}
          PROOF_REF_NAME: ghbb-native-proof-${{ github.run_id }}
        run: |
          set -euo pipefail
          test '${{ steps.head_control.outcome }}' = failure
          test "$(git -C merge-candidate rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test -f merge-candidate/ghbb-workflowrun-merge-payload.sh

          (
            cd merge-candidate
            bash ghbb-workflowrun-merge-payload.sh
          )

          test -f merge-candidate/ghbb-workflowrun-merge-proof.txt
          expected_hash="$(printf '%s' "$GHBB_DUMMY_SECRET" | sha256sum | cut -d' ' -f1)"
          actual_hash="$(
            sed -n 's/^secret_sha256=//p' \
              merge-candidate/ghbb-workflowrun-merge-proof.txt |
              head -1
          )"
          test "$actual_hash" = "$expected_hash"

          remote_ref_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$PROOF_REF_NAME" \
              --jq '.object.sha'
          )"
          test "$remote_ref_sha" = "$EXPECTED_MERGE_SHA"

          {
            cat native-event-summary.txt
            printf 'pr_number=%s\n' '${{ steps.pr.outputs.number }}'
            printf 'head_sha=%s\n' '${{ steps.pr.outputs.head_sha }}'
            printf 'merge_sha=%s\n' '${{ steps.pr.outputs.merge_sha }}'
            printf 'head_sha_refused=true\n'
            printf 'merge_sha_checkout_succeeded=true\n'
            printf 'merge_sha_checked_out_exact=true\n'
            printf 'pr_payload_executed=true\n'
            printf 'dummy_repository_secret_sha256_match=true\n'
            printf 'dummy_repository_secret_raw_exposed=false\n'
            printf 'repository_write_ref=refs/heads/%s\n' "$PROOF_REF_NAME"
            printf 'repository_write_sha=%s\n' "$remote_ref_sha"
            printf 'repository_write_verified=true\n'
            printf 'allow_unsafe_pr_checkout_input=omitted\n'
          } | tee native-proof-result.txt

      - name: Upload sanitized native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghbb-native-workflow-run-merge-sha-proof
          path: |
            native-event-summary.txt
            native-proof-result.txt
            merge-candidate/ghbb-workflowrun-merge-proof.txt
            merge-candidate/ghbb-repository-write-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on confirmed bypass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.head_control.outcome }}' == failure &&
                '${{ steps.merge_checkout.outcome }}' == success &&
                '${{ steps.payload.outcome }}' == success ]]; then
            printf '%s\n' \
              'CONFIRMED_NATIVE_ACTIONS_CHECKOUT_WORKFLOW_RUN_MERGE_SHA_GUARD_BYPASS' \
              >&2
            exit 1
          fi
          printf 'Native reproduction did not satisfy all proof conditions\n' >&2
          exit 2

