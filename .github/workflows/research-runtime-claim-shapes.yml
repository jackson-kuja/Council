name: Research runtime claim shapes

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-runtime-claim-shapes.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist claim types and non-sensitive structural metadata
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto')
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
            function shape(value) {
              if (Array.isArray(value)) return {type: 'array', length: value.length, item_types: [...new Set(value.map(v => typeof v))]}
              if (value && typeof value === 'object') return {type: 'object', keys: Object.keys(value).sort()}
              const text = String(value ?? '')
              return {
                type: typeof value,
                length: text.length,
                is_guid: /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(text),
                is_hex32: /^[0-9a-f]{32}$/i.test(text),
                is_numeric: /^\d+$/.test(text),
                separators: [...new Set(text.match(/[^A-Za-z0-9]/g) || [])].sort(),
                sha256: crypto.createHash('sha256').update(text).digest('hex')
              }
            }
            const payload = {
              workflow_run_id: context.runId,
              runtime_path_segments: new URL(process.env.ACTIONS_RUNTIME_URL).pathname.split('/').filter(Boolean).map(segment => ({length: segment.length, sha256: crypto.createHash('sha256').update(segment).digest('hex')})),
              claims: Object.fromEntries(Object.entries(claims).sort(([a],[b]) => a.localeCompare(b)).map(([k,v]) => [k, shape(v)]))
            }
            const text = JSON.stringify(payload, null, 2) + '\n'
            const path = 'runtime-claim-shapes.json'
            const branch = 'research-results-runtime-context'
            let sha
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch})
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist runtime claim shapes from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })
