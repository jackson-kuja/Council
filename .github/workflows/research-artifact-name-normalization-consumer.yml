name: Research artifact-name normalization consumer

on:
  workflow_run:
    workflows: ["Research artifact-name normalization producer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  consume:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      RESEARCH_DUMMY_SECRET: RESEARCH-OWNED-DUMMY-ARTIFACT-NAME-20260727
    steps:
      - name: Prepare isolated trusted parent and baseline script
        id: baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'sandbox\drop' | Out-Null
          New-Item -ItemType Directory -Force -Path 'sandbox\victim' | Out-Null
          @'
          $ErrorActionPreference = 'Stop'
          @(
            'marker=TRUSTED-BASELINE-SCRIPT'
            'source=trusted-consumer'
          ) | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'research-artifact-name-proof.txt') -Encoding utf8
          '@ | Set-Content -Path 'sandbox\victim\trusted-consumer.ps1' -Encoding utf8
          $hash = (Get-FileHash -Algorithm SHA256 'sandbox\victim\trusted-consumer.ps1').Hash.ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "baseline_hash=$hash"

      - name: Download all upstream artifacts with released action
        id: download
        uses: actions/download-artifact@v8
        with:
          path: sandbox/drop
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Evaluate artifact-name destination containment
        id: evaluate
        shell: pwsh
        env:
          BASELINE_HASH: ${{ steps.baseline.outputs.hash }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outside = 'sandbox\victim\trusted-consumer.ps1'
          $safeControl = "sandbox\drop\research-safe-$env:UPSTREAM_RUN_ID\safe\control.txt"

          $outsideExists = Test-Path -LiteralPath $outside
          $outsideHash = if ($outsideExists) {
            (Get-FileHash -Algorithm SHA256 -LiteralPath $outside).Hash.ToLowerInvariant()
          } else { '<missing>' }
          $outsideChanged = $outsideExists -and ($outsideHash -ne $env:BASELINE_HASH)
          $payloadMarkerPresent = $false
          if ($outsideExists) {
            $payloadMarkerPresent = [bool](Select-String -LiteralPath $outside -SimpleMatch 'RESEARCH-ARTIFACT-NAME-NORMALIZATION-20260727' -Quiet)
          }
          $safeControlPresent = Test-Path -LiteralPath $safeControl

          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'research-artifact-name-proof.txt')
          if ($outsideExists) {
            & pwsh -NoLogo -NoProfile -NonInteractive -File $outside
          }

          $proofPath = Join-Path $env:RUNNER_TEMP 'research-artifact-name-proof.txt'
          $proofExists = Test-Path -LiteralPath $proofPath
          $proof = if ($proofExists) { Get-Content -LiteralPath $proofPath -Raw } else { '' }
          $expectedSecretHash = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              [System.Text.Encoding]::UTF8.GetBytes($env:RESEARCH_DUMMY_SECRET)
            )
          ).Replace('-', '').ToLowerInvariant()
          $payloadExecuted = $proof -match 'marker=RESEARCH-ARTIFACT-NAME-NORMALIZATION-20260727'
          $secretHashMatched = $proof -match [regex]::Escape("dummy_secret_sha256=$expectedSecretHash")

          $dropChildren = @()
          if (Test-Path -LiteralPath 'sandbox\drop') {
            $dropChildren = Get-ChildItem -LiteralPath 'sandbox\drop' -Force | ForEach-Object { $_.Name }
          }
          $dropChildrenJson = $dropChildren | ConvertTo-Json -Compress
          if (-not $dropChildrenJson) { $dropChildrenJson = '[]' }

          $boundaryFailure = $outsideChanged -and $payloadMarkerPresent -and $payloadExecuted -and $secretHashMatched -and $safeControlPresent

          @(
            "upstream_run_id=$env:UPSTREAM_RUN_ID"
            "download_outcome=${{ steps.download.outcome }}"
            "baseline_hash=$env:BASELINE_HASH"
            "outside_exists=$($outsideExists.ToString().ToLowerInvariant())"
            "outside_hash=$outsideHash"
            "outside_changed=$($outsideChanged.ToString().ToLowerInvariant())"
            "safe_control_present=$($safeControlPresent.ToString().ToLowerInvariant())"
            "payload_marker_present=$($payloadMarkerPresent.ToString().ToLowerInvariant())"
            "payload_executed=$($payloadExecuted.ToString().ToLowerInvariant())"
            "dummy_secret_sha256_match=$($secretHashMatched.ToString().ToLowerInvariant())"
            'dummy_secret_raw_exposed=false'
            "drop_children_json=$dropChildrenJson"
            "artifact_name_containment_failure=$($boundaryFailure.ToString().ToLowerInvariant())"
          ) | Set-Content -Path 'artifact-name-normalization-result.txt' -Encoding utf8
          Get-Content -LiteralPath 'artifact-name-normalization-result.txt'
          "boundary_failure=$($boundaryFailure.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-artifact-name-normalization-result-${{ github.run_id }}
          path: artifact-name-normalization-result.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Persist sanitized result to owned research branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let text = 'result_file_missing=true\n'
            try { text = fs.readFileSync('artifact-name-normalization-result.txt', 'utf8') } catch (_) {}
            const path = 'latest-result.txt'
            const branch = 'research-results-artifact-name-normalization'
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              })
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Persist artifact-name normalization result from ${context.runId}`,
              content: Buffer.from(text).toString('base64'),
              ...(sha ? {sha} : {})
            })

      - name: Fail closed on confirmed destination escape
        if: always()
        shell: pwsh
        env:
          BOUNDARY_FAILURE: ${{ steps.evaluate.outputs.boundary_failure }}
        run: |
          if ($env:BOUNDARY_FAILURE -eq 'true') {
            Write-Error 'CONFIRMED_ARTIFACT_NAME_DESTINATION_CONTAINMENT_FAILURE'
            exit 1
          }
          Write-Host 'RESULT=NO_CONFIRMED_ARTIFACT_NAME_DESTINATION_ESCAPE'
