name: GHBB controlled run index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghbb-run-index.yml
      - ghbb-run-index-trigger.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist recent controlled consumer run states
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })
            const matches = (response.data.workflow_runs || [])
              .filter(run => run.name === 'GHBB download artifact Windows normalization consumer')
              .slice(0, 20)
              .map(run => ({
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                created_at: run.created_at,
                updated_at: run.updated_at,
                html_url: run.html_url
              }))

            const payload = {
              generated_by_run: context.runId,
              generated_at: new Date().toISOString(),
              matches
            }
            const path = 'ghbb-run-index.json'
            const branch = 'ghbb-run-index-results'
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              })
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Update controlled run index from ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? {sha} : {})
            })

            const lines = [
              '<!-- ghbb-controlled-run-index -->',
              `GHBB controlled consumer run index from ${context.runId}:`,
              `- matches: \`${matches.length}\``
            ]
            for (const run of matches.slice(0, 10)) {
              lines.push(`- run=\`${run.id}\` status=\`${run.status}\` conclusion=\`${run.conclusion}\` event=\`${run.event}\` head_sha=\`${run.head_sha}\` created=\`${run.created_at}\``)
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: lines.join('\n')
            })
