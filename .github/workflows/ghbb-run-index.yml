name: GHBB controlled run index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghbb-run-index.yml
      - ghbb-run-index-trigger.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist recent controlled run states
        uses: actions/github-script@v7
        with:
          script: |
            const trackedNames = new Set([
              'GHBB download artifact Windows normalization consumer',
              'GHBB create symlink probe branch',
              'GHBB upload artifact symlink containment probe',
              'GHBB artifact name parent-path producer',
              'GHBB download artifact parent-name consumer',
              'Research legacy Actions route discovery branch',
              'Research runtime claim shapes',
              'Research runtime claim details',
              'Research runner diagnostic route patterns',
              'Research own Actions plan route proof',
              'Research runner job metadata shape',
              'Research own Actions timeline route proof',
              'Research own timeline through SystemVssConnection'
            ])
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })
            const matches = (response.data.workflow_runs || [])
              .filter(run => trackedNames.has(run.name))
              .slice(0, 70)
              .map(run => ({
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                created_at: run.created_at,
                updated_at: run.updated_at,
                html_url: run.html_url
              }))

            const payload = {
              generated_by_run: context.runId,
              generated_at: new Date().toISOString(),
              matches
            }
            const path = 'ghbb-run-index.json'
            const branch = 'ghbb-run-index-results'
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              })
              if (!Array.isArray(current.data)) sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Update controlled run index from ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? {sha} : {})
            })

            const lines = [
              '<!-- ghbb-controlled-run-index -->',
              `GHBB controlled run index from ${context.runId}:`,
              `- matches: \`${matches.length}\``
            ]
            for (const run of matches.slice(0, 20)) {
              lines.push(`- name=\`${run.name}\` run=\`${run.id}\` status=\`${run.status}\` conclusion=\`${run.conclusion}\` event=\`${run.event}\` head_sha=\`${run.head_sha}\` created=\`${run.created_at}\``)
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: lines.join('\n')
            })
