name: GHBB controlled run index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghbb-run-index.yml
      - ghbb-run-index-trigger.txt

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish recent controlled consumer run states
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })
            const matches = (response.data.workflow_runs || [])
              .filter(run => run.name === 'GHBB download artifact Windows normalization consumer')
              .slice(0, 10)
            const lines = [
              '<!-- ghbb-controlled-run-index -->',
              `GHBB controlled consumer run index from ${context.runId}:`,
              `- matches: \`${matches.length}\``
            ]
            for (const run of matches) {
              lines.push(`- run=\`${run.id}\` status=\`${run.status}\` conclusion=\`${run.conclusion}\` event=\`${run.event}\` head_sha=\`${run.head_sha}\` created=\`${run.created_at}\``)
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: lines.join('\n')
            })
