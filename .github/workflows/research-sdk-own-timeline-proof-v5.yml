name: Research SDK timeline proof with protected token handoff

on:
  push:
    branches: [research-sandbox-artifact-name-normalization]
    paths:
      - .github/workflows/research-sdk-own-timeline-proof-v5.yml
      - research/runtime-sdk-probe/Program.cs

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the reviewable probe source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse the owned RunnerJobRequest and stage the short-lived token locally
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path')
            const token=process.env.ACTIONS_RUNTIME_TOKEN||''
            if(!token)throw new Error('ACTIONS_RUNTIME_TOKEN unavailable to JavaScript action')
            core.setSecret(token)
            fs.writeFileSync('runtime-token.txt',token,{mode:0o600})
            const files=[]
            function walk(root,depth=0){if(depth>7)return;let entries=[];try{entries=fs.readdirSync(root,{withFileTypes:true})}catch(_){return}for(const entry of entries){const full=path.join(root,entry.name);if(entry.isDirectory()){if(/(_diag|runner|work|temp)/i.test(full)||depth<3)walk(full,depth+1)}else if(entry.isFile()&&/^Worker_.*\.log$/i.test(entry.name)){try{files.push({full,mtime:fs.statSync(full).mtimeMs})}catch(_){}}}}
            walk('/home/runner');files.sort((a,b)=>b.mtime-a.mtime)
            function extract(text){const marker=text.indexOf('Job message:'),start=text.indexOf('{',marker);if(marker<0||start<0)return null;let depth=0,quoted=false,escaped=false;for(let i=start;i<text.length;i++){const ch=text[i];if(quoted){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch==='"')quoted=false;continue}if(ch==='"')quoted=true;else if(ch==='{')depth++;else if(ch==='}'&&--depth===0)return text.slice(start,i+1)}return null}
            let job=null
            for(const file of files){let text='';try{text=fs.readFileSync(file.full,'utf8')}catch(_){continue};const raw=extract(text);if(!raw)continue;try{const parsed=JSON.parse(raw);if(parsed?.messageType==='RunnerJobRequest'){job=parsed;break}}catch(_){}}
            if(!job)throw new Error('RunnerJobRequest unavailable')
            const endpoint=(job.resources?.endpoints||[]).find(item=>item?.name==='SystemVssConnection')
            if(!endpoint?.url)throw new Error('SystemVssConnection unavailable')
            fs.writeFileSync('route.json',JSON.stringify({endpoint:endpoint.url,scope:job.plan.scopeIdentifier,hub:job.plan.planType,plan:job.plan.planId,timeline:job.timeline.id}))
            console.log('route_context_valid=true')
            console.log('runtime_token_staged_locally=true')

      - name: Build and execute the exact runner SDK lifecycle
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_BIN="$(dirname "$(find /home/runner/actions-runner -type f -name Runner.Worker.dll -print -quit)")"
          test -f "$RUNNER_BIN/Sdk.dll" && test -f "$RUNNER_BIN/Runner.Sdk.dll" && test -s runtime-token.txt
          mkdir -p probe
          cp research/runtime-sdk-probe/Program.cs probe/Program.cs
          cat > probe/probe.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup>
            <ItemGroup><Reference Include="Sdk"><HintPath>$RUNNER_BIN/Sdk.dll</HintPath><Private>true</Private></Reference><Reference Include="Runner.Sdk"><HintPath>$RUNNER_BIN/Runner.Sdk.dll</HintPath><Private>true</Private></Reference></ItemGroup>
          </Project>
          EOF
          set +e
          dotnet build probe/probe.csproj -c Release --nologo > build.log 2>&1
          build_exit=$?
          if [[ "$build_exit" -eq 0 ]]; then
            cp -n "$RUNNER_BIN"/*.dll probe/bin/Release/net8.0/ || true
            RESEARCH_RUNTIME_TOKEN_FILE="$PWD/runtime-token.txt" dotnet probe/bin/Release/net8.0/probe.dll > run.log 2>&1
            run_exit=$?
          else
            run_exit=-1
          fi
          set -e
          rm -f runtime-token.txt
          printf 'build_exit=%s\nrun_exit=%s\ntoken_file_deleted=%s\n' "$build_exit" "$run_exit" "$([[ ! -e runtime-token.txt ]]&&echo true||echo false)" > status.txt
          if [[ ! -f sdk-result.json ]]; then
            python3 - <<'PY'
          import json,re
          from pathlib import Path
          text=''.join(Path(name).read_text(errors='replace') if Path(name).exists() else '' for name in ('build.log','run.log'))
          text=re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}','<guid>',text);text=re.sub(r'[A-Za-z0-9_-]{80,}','<opaque>',text)
          Path('sdk-result.json').write_text(json.dumps({'success':False,'harness_error':True,'diagnostic_tail':text[-5000:]},indent=2)+'\n')
          PY
          fi
          cat status.txt
          cat sdk-result.json

      - name: Persist sanitized proof
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');let route={},sdk={success:false,result_file_missing:true},status=''
            try{route=JSON.parse(fs.readFileSync('route.json','utf8'))}catch(_){};try{sdk=JSON.parse(fs.readFileSync('sdk-result.json','utf8'))}catch(_){};try{status=fs.readFileSync('status.txt','utf8').trim()}catch(_){}
            const hash=value=>crypto.createHash('sha256').update(String(value??'')).digest('hex'),endpoint=(()=>{try{return new URL(route.endpoint)}catch(_){return null}})()
            const payload={workflow_run_id:context.runId,endpoint_origin:endpoint?.origin||'',endpoint_path_segment_lengths:endpoint?endpoint.pathname.split('/').filter(Boolean).map(item=>item.length):[],endpoint_sha256:hash(route.endpoint),scope_sha256:hash(route.scope),plan_sha256:hash(route.plan),timeline_sha256:hash(route.timeline),plan_timeline_same:String(route.plan||'').toLowerCase()===String(route.timeline||'').toLowerCase(),hub:route.hub||'',status,sdk}
            const branch='research-results-runtime-context',path='sdk-own-timeline-proof-v5.json';let sha
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch});if(!Array.isArray(current.data))sha=current.data.sha}catch(error){if(error.status!==404)throw error}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,message:`Persist protected-token SDK proof from ${context.runId}`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),...(sha?{sha}:{})})

      - name: Require the exact owned positive control
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open('sdk-result.json'))
          assert result.get('success') and result.get('connection_authenticated') and result.get('timeline_id_match') and result.get('record_count',0)>0,'OWNED_PROTECTED_TOKEN_SDK_CONTROL_FAILED'
          print('OWNED_PROTECTED_TOKEN_SDK_CONTROL_VALID')
          PY
