name: Council
options:
  bundleIdPrefix: athenlabs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  ElevenLabsSDK:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    from: "3.0.0"
  ElevenLabsComponents:
    url: https://github.com/elevenlabs/components-swift.git
    branch: main
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"

schemes:
  Council:
    build:
      targets:
        Council: all
  CouncilLiveActivityExtension:
    build:
      targets:
        CouncilLiveActivityExtension: all

targets:
  Council:
    type: application
    platform: iOS
    sources:
      - Council
      - Shared
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Council/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 55P8HSA8J6
        PRODUCT_BUNDLE_IDENTIFIER: athenlabs.Council
    dependencies:
      - package: ElevenLabsSDK
        product: ElevenLabs
      - package: ElevenLabsComponents
        product: ElevenLabsComponents
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseFunctions
      - package: RevenueCat
        product: RevenueCat
      - target: CouncilLiveActivityExtension
        embed: true

  CouncilLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - CouncilLiveActivity
      - Shared
    dependencies:
      - package: ElevenLabsComponents
        product: ElevenLabsComponents
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CouncilLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: athenlabs.Council.LiveActivityExtension
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 55P8HSA8J6
